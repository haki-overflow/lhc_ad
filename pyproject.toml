[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lhc_ad"
version = "0.1.0"
description = "Physics or particle counting? Auditing what a jet autoencoder actually uses."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "tables",
    "h5py",
    "scikit-learn",
    "torch",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
